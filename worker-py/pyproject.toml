[project]
name = "convergent-worker"
version = "0.1.0"
description = "Project Convergent async memory, supersession & KV eviction workers"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.2.0",
  "redis>=5.2.0",
  "nats-py>=2.9.0",
  "httpx>=0.28.0",
  "blake3>=1.0.0",
  "pydantic>=2.10.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/convergent_worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
