# NVIDIA GPU override: adds self-hosted vLLM + LMCache (CacheBlend) connected to Valkey.
# Usage on a Linux NVIDIA GPU host:
#   docker compose -f deploy/compose.yml -f deploy/compose.gpu.yml up -d
services:
  vllm:
    image: vllm/vllm-openai:latest
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      LMCACHE_CONFIG_FILE: /etc/convergent/lmcache-config.yaml
      LMCACHE_USE_EXPERIMENTAL: "True"
      HF_TOKEN: "${HF_TOKEN:-}"
    volumes:
      - ./lmcache-config.yaml:/etc/convergent/lmcache-config.yaml:ro
      - vllm_cache:/root/.cache/huggingface
    command:
      - --model
      - "${CONVERGENT_MODEL_ID:-Qwen/Qwen3-32B-FP8}"
      - --enable-prefix-caching
      - --kv-transfer-config
      - '{"kv_connector":"LMCacheConnectorV1","kv_role":"kv_both"}'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      valkey:
        condition: service_healthy

volumes:
  vllm_cache:
