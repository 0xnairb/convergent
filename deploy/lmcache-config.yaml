# Production LMCache configuration for Project Convergent (Layer 1 Smart Cache)
chunk_size: 256
local_cpu: true
max_local_cpu_size: 16.0
remote_url: "redis://valkey:6379"
remote_serde: "naive"

# Non-prefix composable KV-blocks (CacheBlend)
enable_blending: true
blend_recompute_ratio: 0.15
blend_min_tokens: 256

# Mandatory cryptographic prefix/chunk hashing (never builtin)
pre_caching_hash_algorithm: "sha256"
